name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  test:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flowforge_test
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django system check
        env:
          PYTHONPATH: src
          SECRET_KEY: test-key-ci-not-for-production
          DEBUG: "False"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: flowforge_test
          DB_USER: flowforge
          DB_PASSWORD: flowforge_password
          DB_HOST: localhost
          DB_PORT: "5432"
        run: python manage.py check

      - name: Run Pytest
        env:
          PYTHONPATH: src
          SECRET_KEY: test-key-ci-not-for-production
          DEBUG: "False"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: flowforge_test
          DB_USER: flowforge
          DB_PASSWORD: flowforge_password
          DB_HOST: localhost
          DB_PORT: "5432"
        run: pytest -v
